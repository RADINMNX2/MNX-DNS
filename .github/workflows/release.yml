name: Build & Release MNX DNS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --force

      - name: Build Web Assets (Vite)
        run: npx vite build

      - name: Package Windows .exe Installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 -c.directories.output=release

      - name: List output files
        run: |
          echo "=== release/ directory ==="
          dir release /s /b
          echo "=== dist/ directory ==="
          if exist dist dir dist /s /b

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MNX-DNS-Windows-x64
          path: |
            release/*.exe
            release/*.msi
          if-no-files-found: warn
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v2.0.0-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('MNX DNS {0}', github.ref_name) || 'MNX DNS v2.0.0 (Latest Build)' }}
          files: |
            release/*.exe
            release/*.msi
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
