name: Build & Release MNX DNS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. v2.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --force

      - name: Ensure binary directories exist
        run: |
          if not exist "binaries\windivert" mkdir "binaries\windivert"
          if not exist "binaries\wireguard" mkdir "binaries\wireguard"
          if not exist "binaries\aether" mkdir "binaries\aether"
          echo. > "binaries\windivert\.gitkeep"
          echo. > "binaries\wireguard\.gitkeep"
          echo. > "binaries\aether\.gitkeep"
          if not exist "data" mkdir "data"
          if not exist "data\domains.txt" echo # placeholder > "data\domains.txt"

      - name: Typecheck
        run: node ./node_modules/typescript/bin/tsc --noEmit

      - name: Build Vite (renderer + main + preload)
        run: npx vite build

      - name: Package Electron (Windows x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 -p never

      - name: List build outputs
        run: dir /s /b release\*.* 2>nul

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MNX-DNS-Windows-x64
          path: |
            release/*.exe
            release/*.msi
            release/*.zip
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: MNX-DNS-Windows-x64
          path: artifacts

      - name: List downloaded artifacts
        run: ls -la artifacts/ || echo "No artifacts found"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: artifacts/*
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to main branch release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: 'latest-build'
          name: 'Latest Build (main)'
          files: artifacts/*
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
