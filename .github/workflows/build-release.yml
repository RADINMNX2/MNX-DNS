name: Build & Release MNX DNS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --force

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build renderer + main + preload
        run: npx vite build

      - name: Package Electron for Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 -p never

      - name: List artifacts
        run: dir release

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: MNX-DNS-Windows-x64
          path: release/*.exe
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: MNX-DNS-Windows-x64
          path: artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest-build' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('MNX DNS {0}', github.ref_name) || 'Latest Build' }}
          files: artifacts/*
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
