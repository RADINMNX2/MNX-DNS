appId: com.radinmnx.mnxdns
productName: MNX DNS
afterPack: 'removeLocales.js'
artifactName: '${productName}-prelease-${os}-${arch}-${version}.${ext}'
files:
  - '**/*'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme,test,__tests__,tests,powered-test,example,examples}'
  - '!**/node_modules/.bin'
  - '!**/*.{o,hprof,orig,pyc,pyo,rbc}'
  - '!**/._*'
  - '!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,__pycache__,thumbs.db,.gitignore,.gitattributes,.editorconfig,.flowconfig,.yarn-metadata.json,.idea,appveyor.yml,.travis.yml,circle.yml,npm-debug.log,.nyc_output,yarn.lock,.yarn-integrity}'
  - '!**/node_modules/search-index/si${/*}'
  - '!**/*.md'
  - '!**/*.yml'
  - '!**/.github'
  - '!**/release'
  - '!**/.eslint*'
  - '!**/jest*'
  - '!**/*.test.*'
  - '!**/__tests__'
asar: true
compression: maximum
directories:
  output: 'release/${version}'
extraResources:
  - from: 'binaries/windivert'
    to: 'binaries/windivert'
  - from: 'binaries/wireguard'
    to: 'binaries/wireguard'
  - from: 'binaries/aether'
    to: 'binaries/aether'
  - from: 'data'
    to: 'data'
win:
  icon: 'public/icons/icon.ico'
  requestedExecutionLevel: 'highestAvailable'
  publish:
    - github
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  runAfterFinish: true
  createDesktopShortcut: true
  shortcutName: 'MNX DNS'
  installerIcon: 'public/icons/icon.ico'
linux:
  icon: 'public/icons/icon.icns'
  maintainer: 'mnxdns.io'
  target:
    - AppImage
    - deb
  category: Utilities
  publish:
    - github
mac:
  icon: 'public/icons/icon.png'
  target:
    - dmg
    - zip
  category: Utilities
  publish:
    - github
npmRebuild: true
nodeGypRebuild: false

publish:
  provider: github
  owner: 'RADINMNX2'
  repo: 'MNX-DNS'
